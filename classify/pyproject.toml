[project]
name = "jev-classify-lab"
version = "0.1.0"
description = "Is Jev the best classifier? Zero-shot typed decisions against LLMs, embeddings and trained classifiers on public intent datasets."
requires-python = ">=3.12"
dependencies = [
  "typesafe-sdk==0.7.1",
  "scikit-learn>=1.5",
  "scipy>=1.13",
  "numpy>=2.0",
  "pyarrow>=17",
  "httpx>=0.27",
]
